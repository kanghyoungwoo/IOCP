name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "track3-iocp-direct-routing" ]
  pull_request:
    branches: [ "main", "track3-iocp-direct-routing" ]

permissions:
  contents: read
  checks: write          # 테스트 결과를 PR 체크 탭에 쓰기 위해 필요
  pull-requests: write   # PR에 테스트 결과 코멘트를 달기 위해 필요

jobs:
  build-and-test:
    runs-on: windows-latest

    env:
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: x64
      SLN_DIR: IOCPChatServer
      TEST_PROJECT: IOCPChatServer/Tests/IOCPChatServer_Tests.vcxproj

    steps:
      # 1. 소스코드 체크아웃
      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. MSBuild 환경 설정
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # 3. vcpkg 설치 및 gtest 빌드 (테스트 프로젝트 의존성)
      - name: Setup vcpkg and install gtest
        run: |
          if (-not (Test-Path C:\vcpkg\.vcpkg-root)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg install gtest:x64-windows --no-binarycaching

      # 4. 테스트 프로젝트만 빌드 (MySQL 등 서버 의존성 불필요)
      - name: Build test project
        run: |
          msbuild ${{ env.TEST_PROJECT }} `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            /m

      # 5. 테스트 실행 및 XML 리포트 생성
      - name: Run Google Tests
        working-directory: ${{ env.SLN_DIR }}/Tests/x64/${{ env.BUILD_CONFIGURATION }}
        run: .\IOCPChatServer_Tests.exe --gtest_output="xml:test_results.xml"

      # 6. 테스트 결과 GitHub UI 시각화
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: C++ Google Test Results
          path: ${{ env.SLN_DIR }}/Tests/x64/${{ env.BUILD_CONFIGURATION }}/test_results.xml
          reporter: java-junit
          fail-on-error: true

  chaos-test:
    runs-on: windows-latest
    needs: build-and-test

    env:
      SERVER_PROJECT: IOCPChatServer/IOCPChatServer.vcxproj
      CHAOS_PROJECT: Client/ChaosBotSystem/ChaosBotSystem.vcxproj
      CHAOS_DIR: Client/ChaosBotSystem
      SERVER_OUT: IOCPChatServer/x64/CI
      CHAOS_OUT: Client/ChaosBotSystem/x64/Release

    steps:
      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # 1. 서버 CI 구성 빌드 (MySQL/Redis 의존성 없음)
      - name: Build server (CI config)
        run: |
          msbuild ${{ env.SERVER_PROJECT }} `
            /p:Configuration=CI /p:Platform=x64 /m

      # 2. ChaosBotSystem 빌드 (외부 의존성 없음)
      - name: Build ChaosBotSystem
        run: |
          msbuild ${{ env.CHAOS_PROJECT }} `
            /p:Configuration=Release /p:Platform=x64 /m

      # 3. CI 전용 서버 config 배포 (MaxClient=500, JobPoolSize=5000)
      - name: Deploy CI server config
        run: |
          Copy-Item "IOCPChatServer/ci_server_config.json" "${{ env.SERVER_OUT }}/config.json" -Force

      # 4. 서버 백그라운드 실행
      - name: Start server
        run: |
          $proc = Start-Process `
            -FilePath "${{ env.SERVER_OUT }}\IOCPChatServer.exe" `
            -WorkingDirectory "${{ env.SERVER_OUT }}" `
            -PassThru `
            -RedirectStandardOutput "${{ env.SERVER_OUT }}\server_stdout.txt" `
            -RedirectStandardError  "${{ env.SERVER_OUT }}\server_stderr.txt"
          echo "SERVER_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 10

      # 4-1. 시나리오 시작 전 서버 생존 확인 (진단용)
      #       실패 시: 스텝 간 Job Object 정리로 죽은 것
      #       통과 시: 시나리오 부하 중 죽은 것
      - name: Verify server alive before scenarios
        run: |
          Write-Host "Checking server PID=$env:SERVER_PID before any scenario..."
          if (-not (Get-Process -Id $env:SERVER_PID -ErrorAction SilentlyContinue)) {
            Write-Error "Server died BETWEEN STEPS (before Scenario B started)!"
            exit 1
          }
          Write-Host "Server is alive."

      # 4. Scenario B — PIPELINE_BURST (30초)
      - name: Chaos Scenario B - Pipeline Burst
        working-directory: ${{ env.CHAOS_OUT }}
        run: |
          Copy-Item "${{ github.workspace }}/${{ env.CHAOS_DIR }}/ci_config_B.json" config.json
          .\ChaosBotSystem.exe
        timeout-minutes: 2

      - name: Check server alive after Scenario B
        run: |
          if (-not (Get-Process -Id $env:SERVER_PID -ErrorAction SilentlyContinue)) {
            Write-Error "Server crashed during Scenario B!"
            exit 1
          }

      # 5. Scenario C — ZOMBIE_RACE (30초)
      - name: Chaos Scenario C - Zombie Race
        working-directory: ${{ env.CHAOS_OUT }}
        run: |
          Copy-Item "${{ github.workspace }}/${{ env.CHAOS_DIR }}/ci_config_C.json" config.json
          .\ChaosBotSystem.exe
        timeout-minutes: 2

      - name: Check server alive after Scenario C
        run: |
          if (-not (Get-Process -Id $env:SERVER_PID -ErrorAction SilentlyContinue)) {
            Write-Error "Server crashed during Scenario C!"
            exit 1
          }

      # 6. Scenario D — FAST_PATH_BOUNDARY (30초)
      - name: Chaos Scenario D - Fast Path Boundary
        working-directory: ${{ env.CHAOS_OUT }}
        run: |
          Copy-Item "${{ github.workspace }}/${{ env.CHAOS_DIR }}/ci_config_D.json" config.json
          .\ChaosBotSystem.exe
        timeout-minutes: 2

      - name: Check server alive after Scenario D
        run: |
          if (-not (Get-Process -Id $env:SERVER_PID -ErrorAction SilentlyContinue)) {
            Write-Error "Server crashed during Scenario D!"
            exit 1
          }

      # 7. 서버 종료 및 로그 출력
      - name: Stop server and dump logs
        if: always()
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
          Write-Host "=== server stdout (last 50 lines) ==="
          if (Test-Path "${{ env.SERVER_OUT }}\server_stdout.txt") {
            Get-Content "${{ env.SERVER_OUT }}\server_stdout.txt" | Select-Object -Last 50
          }
          Write-Host "=== server stderr ==="
          if (Test-Path "${{ env.SERVER_OUT }}\server_stderr.txt") {
            Get-Content "${{ env.SERVER_OUT }}\server_stderr.txt"
          }
          Write-Host "=== server.log (last 100 lines) ==="
          if (Test-Path "${{ env.SERVER_OUT }}\server.log") {
            Get-Content "${{ env.SERVER_OUT }}\server.log" | Select-Object -Last 100
          }

      # 8. Windows Application Event Log에서 크래시 정보 확인
      - name: Dump Windows crash event log
        if: always()
        run: |
          Write-Host "=== Application Error events (last 10) ==="
          try {
            Get-EventLog -LogName Application -Source "Application Error" -Newest 10 |
              Format-List TimeGenerated, EntryType, Message
          } catch {
            Write-Host "No Application Error events found or access denied."
          }

      # 9. 크래시 덤프 + 로그 파일 아티팩트 업로드
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-test-artifacts
          path: |
            ${{ env.SERVER_OUT }}\*.dmp
            ${{ env.SERVER_OUT }}\server.log
            ${{ env.SERVER_OUT }}\server_stdout.txt
            ${{ env.SERVER_OUT }}\server_stderr.txt
          if-no-files-found: ignore
